name: Service monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: read
concurrency:
  group: service-monitoring
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || vars.OPERATIONS_MONITORING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Check uptime and configured database readiness
        run: node scripts/check-service.mjs
        env:
          OPS_HEALTH_TOKEN: ${{ secrets.OPS_HEALTH_TOKEN }}
