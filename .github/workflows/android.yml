name: Android build
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, lint and build unsigned release bundle
        run: bash ./gradlew --no-daemon lintDebug assembleDebug bundleRelease
      - name: Preserve Android build outputs
        uses: actions/upload-artifact@v4
        with:
          name: careathome-android-demo
          retention-days: 7
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/reports/lint-results-debug.html
